name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparer le projet
        run: |
          mkdir -p www && cp index.html www/
          echo '{"appId":"fr.c4.accueil","appName":"C4 Accueil","webDir":"www"}' > capacitor.config.json
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app-launcher@6
          npx cap add android
          npx cap sync
      - name: Construire l APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: c4-accueil-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
